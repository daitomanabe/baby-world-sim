cli:
  backend: "claude"

event_loop:
  completion_promise: "LOOP_COMPLETE"
  max_iterations: 30
  prompt_file: "PROMPT.md"
  starting_event: "work.start"
  checkpoint_interval: 1

core:
  scratchpad: ".agent/scratchpad.md"
  specs_dir: "./specs/"

hats:
  git_setup:
    name: "Git Setup"
    description: |
      ⚠️ あなたは「Git Setup」です。他に委譲せず自分で実行。

      ```bash
      gh auth status
      git pull origin main
      echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] Git Setup | done | verified" >> .agent/iteration.log
      git add -A && git commit -m "[Ralph] Git Setup: verified" && git push origin main
      ralph emit "git.ready" "Planner開始"
      ```
    triggers:
      - "work.start"
    publishes:
      - "git.ready"
      - "LOOP_COMPLETE"

  planner:
    name: "Planner"
    description: |
      ⚠️ あなたは「Planner」です。他に委譲せず自分で実行。

      baby_world_monthly_model.v0.3.detailed.json の requiredAppFeatures.modules を参照し、
      MVPで必要なタスクを specs/plan.md に出力。

      優先順位:
      1. データ統合（JSONをsrc/dataに配置、型定義）
      2. visual.filterPipeline（視覚フィルタ）
      3. audio.webAudio（聴覚シミュレーション）
      4. evidence.ui（出典表示）

      ```bash
      # 1. plan.md作成（実際にファイルを書く）
      # 2. ログ記録
      echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] Planner | done | plan created" >> .agent/iteration.log
      # 3. git push
      git add -A && git commit -m "[Ralph] Planner: plan created" && git push
      # 4. イベント発行
      ralph emit "plan.ready" "Builder開始"
      ```
    triggers:
      - "git.ready"
    publishes:
      - "plan.ready"

  builder:
    name: "Builder"
    description: |
      ⚠️ あなたは「Builder」です。他に委譲せず、コードを書いてください。

      specs/plan.md から未完了タスク（[ ]）を1つ選び、実装する。

      主要タスク例:
      - src/data/model.ts: baby_world_monthly_model.v0.3.detailed.json の型定義
      - src/data/index.ts: JSONのインポートと提供
      - src/lib/interp.ts: 月次データの補間関数
      - src/features/simulation/VisualSimCanvas.tsx: renderParams.visual を使ったフィルタ
      - src/features/simulation/AudioSimPanel.tsx: renderParams.audio を使った音声

      ```bash
      # 1. コードを実装（Write/Editツール使用）
      # 2. npm run build
      # 3. plan.mdの該当タスクを [x] に
      # 4. ログ記録
      echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] Builder | done | {タスク}" >> .agent/iteration.log
      # 5. git push
      git add -A && git commit -m "[Ralph] Builder: {タスク}" && git push
      # 6. イベント発行
      ralph emit "build.done" "Reviewer依頼"
      ```
    triggers:
      - "plan.ready"
      - "review.changes_requested"
    publishes:
      - "build.done"

  reviewer:
    name: "Reviewer"
    description: |
      ⚠️ あなたは「Reviewer」です。他に委譲せず、レビューしてください。

      ```bash
      # 1. 変更確認
      git diff HEAD~1
      # 2. ビルド確認
      npm run build
      # 3. specs/plan.md で残タスク確認
      ```

      判断:
      - 問題あり → ralph emit "review.changes_requested" "{修正内容}"
      - 残タスクあり → ralph emit "plan.ready" "次タスク"
      - 全完了 → COMPLETION_REPORT.md生成後 ralph emit "LOOP_COMPLETE" "完了"

      ```bash
      echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] Reviewer | done | {結果}" >> .agent/iteration.log
      git add -A && git commit -m "[Ralph] Reviewer: {結果}" && git push
      ralph emit "{イベント}" "{メッセージ}"
      ```
    triggers:
      - "build.done"
    publishes:
      - "review.changes_requested"
      - "plan.ready"
      - "LOOP_COMPLETE"
