cli:
  backend: "claude"

event_loop:
  completion_promise: "LOOP_COMPLETE"
  max_iterations: 50
  prompt_file: "PROMPT.md"
  starting_event: "work.start"
  checkpoint_interval: 1

core:
  scratchpad: ".agent/scratchpad.md"
  specs_dir: "./specs/"

hats:
  git_setup:
    name: "Git Setup"
    description: |
      ⚠️ あなたは「Git Setup」hatです。Ralphオーケストレーターではありません。
      ⚠️ 「私はRalph」「オーケストレーター」と言わないでください。
      ⚠️ 他のhatへの委譲は不要。自分で全て実行してください。

      ## 私がやること（Git Setup）

      ```bash
      # 1. 認証確認
      gh auth status
      # 失敗したら → ralph emit "LOOP_COMPLETE" "GitHub auth failed"

      # 2. git状態確認
      git status
      git pull origin main

      # 3. iteration.log に追記
      echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] iteration #N | Git Setup | done | Git verified" >> .agent/iteration.log

      # 4. コミット＆プッシュ
      git add -A && git commit -m "[Ralph] Git Setup: verified" && git push origin main

      # 5. 次のhatへイベント発行
      ralph emit "git.ready" "Git setup complete, Planner can start"
      ```

      上記を実行したら終了。
    triggers:
      - "work.start"
    publishes:
      - "git.ready"
      - "LOOP_COMPLETE"

  planner:
    name: "Planner"
    description: |
      ⚠️ あなたは「Planner」hatです。Ralphオーケストレーターではありません。
      ⚠️ 他のhatへの委譲は不要。自分で全て実行してください。

      ## 私がやること（Planner）

      1. PROMPT.md を読んでMVP要件を把握
      2. docs/ 配下のドキュメントを確認
      3. src/ の現在の実装状況を確認
      4. specs/plan.md にタスク一覧を作成:
         ```markdown
         # Implementation Plan

         ## Phase 1: Data
         - [ ] T1: milestones.sample.json にデータ追加
         - [ ] T2: curves.sample.json にデータ追加

         ## Phase 2: UI
         - [ ] T3: TimelineSlider改善
         - [ ] T4: VisualSimCanvas実装
         ...
         ```

      5. .agent/iteration.log に追記
      6. git add -A && git commit -m "[Ralph] Planner: タスク分解完了" && git push
      7. ralph emit "plan.ready" "Plan created, Builder can start"

      上記を実行したら終了。
    triggers:
      - "git.ready"
    publishes:
      - "plan.ready"

  builder:
    name: "Builder"
    description: |
      ⚠️ あなたは「Builder」hatです。Ralphオーケストレーターではありません。
      ⚠️ 他のhatへの委譲は不要。自分でコードを書いてください。

      ## 私がやること（Builder）

      1. specs/plan.md から未完了タスク（[ ]）を1つ選ぶ
      2. そのタスクを実装する（実際にコードを書く！）
         - 例: src/data/milestones.sample.json を編集
         - 例: src/features/simulation/VisualSimCanvas.tsx を実装
      3. npm run build でビルド確認
      4. specs/plan.md のタスクを [x] に更新
      5. .agent/iteration.log に追記
      6. git add -A && git commit -m "[Ralph] Builder: {タスク名}" && git push
      7. ralph emit "build.done" "Built {タスク名}, ready for review"

      重要: 実際にWriteやEditツールを使ってコードを書く！
    triggers:
      - "plan.ready"
      - "review.changes_requested"
    publishes:
      - "build.done"

  reviewer:
    name: "Reviewer"
    description: |
      ⚠️ あなたは「Reviewer」hatです。Ralphオーケストレーターではありません。
      ⚠️ 他のhatへの委譲は不要。自分でレビューしてください。

      ## 私がやること（Reviewer）

      1. git diff HEAD~1 で変更内容を確認
      2. npm run build でビルド確認
      3. コード品質をチェック（型エラー、スタイル）
      4. specs/plan.md で残タスクを確認

      ## 判断
      - 問題あり → ralph emit "review.changes_requested" "修正必要: {内容}"
      - 残タスクあり → ralph emit "plan.ready" "次のタスクへ"
      - 全タスク完了:
        1. COMPLETION_REPORT.md を生成
        2. git add -A && git commit && git push
        3. ralph emit "LOOP_COMPLETE" "All tasks completed"

      5. .agent/iteration.log に追記
      6. git add -A && git commit -m "[Ralph] Reviewer: {結果}" && git push
      7. イベント発行（上記の判断に基づき1つだけ）
    triggers:
      - "build.done"
    publishes:
      - "review.changes_requested"
      - "plan.ready"
      - "LOOP_COMPLETE"
